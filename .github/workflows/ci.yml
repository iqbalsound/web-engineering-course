name: ci
on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Week 4 unit tests
        run: node --test "labs/week04-javascript-fundamentals/code/*.test.js"
      - name: Class task CT-4 tests
        run: node --test "assessments/class-tasks/ct04-javascript-kata/solution/*.test.mjs"
      - name: Class task CT-5 and CT-6 run
        run: |
          node assessments/class-tasks/ct05-async-rewrite/solution/users.mjs
          node assessments/class-tasks/ct06-event-bus-signal/solution/bus.mjs

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint every PHP file (PHP 8.3 is the lowest version used in the course)
        run: find labs assessments -name '*.php' -print0 | xargs -0 -n1 php -l

  shell-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: JSON and YAML validity
        run: |
          python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('labs/**/*.json',recursive=True)]"
          python3 -c "import yaml,glob;[yaml.safe_load(open(f)) for f in glob.glob('**/*.y*ml', recursive=True) if '.github' not in f]"
