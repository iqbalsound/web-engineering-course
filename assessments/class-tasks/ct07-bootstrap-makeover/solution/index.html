<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap makeover</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
</head>
<body>
  <header class="container py-4">
    <div class="p-5 mb-4 bg-body-tertiary rounded-3 text-center">
      <h1 class="display-5 fw-bold">Campus Shop</h1>
      <p class="lead">Everything for the new semester.</p>
      <a class="btn btn-primary btn-lg" href="#products">Shop now</a>
    </div>
  </header>
  <main class="container" id="products">
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h5 card-title">Notebook</h2><p class="card-text">Rs 350</p></div></div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h5 card-title">Gel pens</h2><p class="card-text">Rs 280</p></div></div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h5 card-title">USB-C cable</h2><p class="card-text">Rs 650</p></div></div></div>
    </div>
    <nav class="my-4" aria-label="Pages">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled"><span class="page-link">Previous</span></li>
        <li class="page-item active"><a class="page-link" href="#" aria-current="page">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
