<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
</head>
<body>
  <a href="#main">Skip to content</a>
  <header><h1>Hamdard Student Registration</h1>
    <nav aria-label="Primary"><a href="index.html">Home</a> <a href="register.html">Register</a></nav>
  </header>
  <main id="main">
    <form action="thanks.html" method="get">
      <fieldset>
        <legend>Personal details</legend>
        <p><label for="name">Full name</label>
           <input id="name" name="name" required minlength="3" autocomplete="name"></p>
        <p><label for="email">Email</label>
           <input id="email" name="email" type="email" required autocomplete="email"></p>
        <p><label for="cnic">CNIC (xxxxx-xxxxxxx-x)</label>
           <input id="cnic" name="cnic" required inputmode="numeric" pattern="[0-9]{5}-[0-9]{7}-[0-9]"></p>
        <p><label for="mobile">Mobile (03xx-xxxxxxx)</label>
           <input id="mobile" name="mobile" type="tel" required pattern="03[0-9]{2}-[0-9]{7}" autocomplete="tel"></p>
        <p><label for="dob">Date of birth</label>
           <input id="dob" name="dob" type="date" required max="2010-12-31"></p>
      </fieldset>
      <fieldset>
        <legend>Programme</legend>
        <p><label for="dept">Department</label>
           <input id="dept" name="dept" list="depts" required>
           <datalist id="depts"><option value="Software Engineering"><option value="Computer Science"><option value="Electrical Engineering"></datalist></p>
        <p>Semester:
           <label><input type="radio" name="sem" value="5" checked> 5th</label>
           <label><input type="radio" name="sem" value="6"> 6th</label></p>
        <p><label for="gpa">Expected GPA</label>
           <input id="gpa" name="gpa" type="range" min="2" max="4" step="0.1" value="3"></p>
        <p><label><input type="checkbox" name="terms" required> I accept the code of conduct</label></p>
      </fieldset>
      <button type="submit">Register</button> <button type="reset">Clear</button>
    </form>
  </main>
  <footer><small>&copy; 2026 Hamdard University</small></footer>
</body>
</html>
